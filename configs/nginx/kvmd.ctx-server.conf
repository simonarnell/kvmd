# Do not edit this file

absolute_redirect off;

index index.html;

auth_request /auth_check;

location = /auth_check {
	internal;
	proxy_pass http://kvmd/auth/check;
	proxy_pass_request_body off;
	proxy_set_header Content-Length "";
	auth_request off;
}

location = /auth_check_streamer {
	internal;
	proxy_pass http://kvmd/auth/check_streamer;
	proxy_pass_request_body off;
	proxy_set_header Content-Length "";
	auth_request off;
}

location / {
	root /usr/share/kvmd/web;
	include /etc/kvmd/nginx/loc-login.conf;
	include /etc/kvmd/nginx/loc-nocache.conf;
}

location @login {
	return 302 /login;
}

location /login {
	root /usr/share/kvmd/web;
	include /etc/kvmd/nginx/loc-nocache.conf;
	auth_request off;
}

location /share {
	root /usr/share/kvmd/web;
	include /etc/kvmd/nginx/loc-nocache.conf;
	auth_request off;
}

location = /share/css/user.css {
	alias /etc/kvmd/web.css;
	auth_request off;
}

location = /favicon.ico {
	alias /usr/share/kvmd/web/favicon.ico;
	include /etc/kvmd/nginx/loc-nocache.conf;
	auth_request off;
}

location = /robots.txt {
	alias /usr/share/kvmd/web/robots.txt;
	include /etc/kvmd/nginx/loc-nocache.conf;
	auth_request off;
}

# ===== Janus (auth + authz required) =====
#
# Unlike /streamer below, /janus/ws is proxied to kvmd itself, not straight
# to the janus-ws unix socket -- kvmd brokers this connection (see
# kvmd/apps/kvmd/api/janus.py) so it can enforce streamer.view to connect at
# all, and separately strip mic/camera negotiation from users lacking
# streamer.webcam (the operator-supplied audio/video the webcam/mic USB
# gadget function injects into the target). This needs message-level
# inspection that a plain reverse proxy can't do, hence the extra hop.

location = /janus/ws {
	proxy_pass http://kvmd/janus/ws;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-websocket.conf;
}

location = /share/js/kvm/janus.js {
	alias /usr/share/janus/javascript/janus.js;
	include /etc/kvmd/nginx/loc-nocache.conf;
}

location = /share/js/kvm/adapter.js {
	alias /usr/share/janus/javascript/adapter.js;
	include /etc/kvmd/nginx/loc-nocache.conf;
}

# ===== uStreamer for MJPEG (auth + authz required) =====
#
# ustreamer has no notion of kvmd users/permissions, so unlike locations
# that proxy straight to kvmd (which do their own authz internally and set
# auth_request off), this location needs nginx to make the authz decision
# itself via a dedicated auth_request target that calls into OPA.

location = /streamer {
	auth_request /auth_check_streamer;
	proxy_pass http://ustreamer/;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-nobuffering.conf;
}

location /streamer/ {
	auth_request /auth_check_streamer;
	proxy_pass http://ustreamer/;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-nobuffering.conf;
}

# ===== KVMD-Media Server (auth required) =====

location = /api/media/ws {
	proxy_pass http://media/ws;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-websocket.conf;
}

location = /api/media {
	proxy_pass http://media/;
	include /etc/kvmd/nginx/loc-proxy.conf;
}

location /api/media/ {
	proxy_pass http://media/;
	include /etc/kvmd/nginx/loc-proxy.conf;
}

# ===== Redfish on Main KVMD =====

location /redfish {
	proxy_pass http://kvmd;
	include /etc/kvmd/nginx/loc-proxy.conf;
	auth_request off;
}

# ===== Main KVMD =====

location = /api/ws {
	proxy_pass http://kvmd/ws;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-websocket.conf;
	auth_request off;
}

location = /api/hid/print {
	proxy_pass http://kvmd/hid/print;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-bigpost.conf;
	proxy_read_timeout 7d;
	auth_request off;
}

location = /api/msd/read {
	proxy_pass http://kvmd/msd/read;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-nobuffering.conf;
	proxy_read_timeout 7d;
	auth_request off;
}

location = /api/msd/write_remote {
	proxy_pass http://kvmd/msd/write_remote;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-nobuffering.conf;
	proxy_read_timeout 7d;
	auth_request off;
}

location = /api/msd/write {
	proxy_pass http://kvmd/msd/write;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-bigpost.conf;
	auth_request off;
}

location = /api/log {
	proxy_pass http://kvmd/log;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-nobuffering.conf;
	proxy_read_timeout 7d;
	auth_request off;
}

location /api/ {
	proxy_pass http://kvmd/;
	include /etc/kvmd/nginx/loc-proxy.conf;
	auth_request off;
}
